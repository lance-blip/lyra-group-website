<svg viewBox="0 0 320 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lyra Group — Option A Asterism">
  <title>Lyra Group — Asterism</title>
  <!-- Icon: true 5-star Lyra parallelogram -->
  <g transform="translate(8,12)">
    <!-- Connecting lines (indigo) -->
    <g stroke="#1B2A4A" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
      <line x1="32" y1="8" x2="12" y2="28"/>
      <line x1="32" y1="8" x2="52" y2="26"/>
      <line x1="12" y1="28" x2="52" y2="26"/>
      <line x1="12" y1="28" x2="16" y2="56"/>
      <line x1="52" y1="26" x2="48" y2="54"/>
      <line x1="16" y1="56" x2="48" y2="54"/>
    </g>
    <!-- Soft champagne ghost lines -->
    <g stroke="#D4A574" stroke-width="0.75" stroke-linecap="round" opacity="0.35">
      <line x1="32" y1="8" x2="12" y2="28"/>
      <line x1="32" y1="8" x2="52" y2="26"/>
      <line x1="12" y1="28" x2="52" y2="26"/>
      <line x1="12" y1="28" x2="16" y2="56"/>
      <line x1="52" y1="26" x2="48" y2="54"/>
      <line x1="16" y1="56" x2="48" y2="54"/>
    </g>
    <!-- Stars -->
    <circle cx="32" cy="8" r="3.4" fill="#C4784A"/>
    <circle cx="32" cy="8" r="6" fill="#D4A574" opacity="0.22"/>
    <circle cx="12" cy="28" r="2.4" fill="#1B2A4A"/>
    <circle cx="52" cy="26" r="2.3" fill="#1B2A4A"/>
    <circle cx="16" cy="56" r="2.5" fill="#D4A574"/>
    <circle cx="48" cy="54" r="2.4" fill="#D4A574"/>
  </g>
  <!-- Wordmark -->
  <text x="88" y="48" fill="#1B2A4A" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600" letter-spacing="-0.02em">Lyra Group</text>
  <text x="88" y="70" fill="#6B6560" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="0.08em">PRECISION RECOVERY. PURPOSEFUL RESULTS.</text>
</svg>
