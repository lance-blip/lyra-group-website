<svg viewBox="0 0 320 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lyra Group — Option B Lyre">
  <title>Lyra Group — Lyre</title>
  <!-- Stylised lyre formed from star-dot geometry -->
  <g transform="translate(10,10)">
    <!-- Lyre arms (U shape) -->
    <path d="M18 14 C14 14 10 22 10 34 C10 48 18 58 32 62 C46 58 54 48 54 34 C54 22 50 14 46 14"
          stroke="#1B2A4A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Crossbar -->
    <path d="M18 28 H46" stroke="#1B2A4A" stroke-width="1.75" stroke-linecap="round" opacity="0.85"/>
    <!-- Strings as dotted star lines -->
    <g stroke="#D4A574" stroke-width="1.1" stroke-linecap="round" opacity="0.75">
      <line x1="24" y1="28" x2="24" y2="52"/>
      <line x1="32" y1="28" x2="32" y2="56"/>
      <line x1="40" y1="28" x2="40" y2="52"/>
    </g>
    <!-- Star dots at key joints -->
    <circle cx="18" cy="14" r="2.6" fill="#C4784A"/>
    <circle cx="46" cy="14" r="2.6" fill="#C4784A"/>
    <circle cx="18" cy="28" r="2" fill="#1B2A4A"/>
    <circle cx="46" cy="28" r="2" fill="#1B2A4A"/>
    <circle cx="24" cy="28" r="1.5" fill="#D4A574"/>
    <circle cx="32" cy="28" r="1.7" fill="#D4A574"/>
    <circle cx="40" cy="28" r="1.5" fill="#D4A574"/>
    <circle cx="32" cy="62" r="3" fill="#C4784A"/>
    <circle cx="32" cy="62" r="5.5" fill="#D4A574" opacity="0.2"/>
    <circle cx="24" cy="52" r="1.4" fill="#1B2A4A"/>
    <circle cx="40" cy="52" r="1.4" fill="#1B2A4A"/>
  </g>
  <text x="88" y="48" fill="#1B2A4A" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600" letter-spacing="-0.02em">Lyra Group</text>
  <text x="88" y="70" fill="#6B6560" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="0.08em">PRECISION RECOVERY. PURPOSEFUL RESULTS.</text>
</svg>
