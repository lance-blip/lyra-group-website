<svg viewBox="0 0 320 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lyra Group — Option D Orbit">
  <title>Lyra Group — Orbit</title>
  <!-- Circle/orbit with Lyra asterism inside -->
  <g transform="translate(8,8)">
    <!-- Outer orbit rings -->
    <circle cx="40" cy="40" r="34" stroke="#1B2A4A" stroke-width="1.25" opacity="0.35" fill="none"/>
    <circle cx="40" cy="40" r="34" stroke="#D4A574" stroke-width="0.6" opacity="0.25" fill="none" stroke-dasharray="2 4"/>
    <circle cx="40" cy="40" r="26" stroke="#1B2A4A" stroke-width="0.9" opacity="0.2" fill="none"/>
    <!-- Inner asterism (scaled) -->
    <g stroke="#1B2A4A" stroke-width="1.35" stroke-linecap="round" opacity="0.9">
      <line x1="40" y1="18" x2="26" y2="32"/>
      <line x1="40" y1="18" x2="54" y2="31"/>
      <line x1="26" y1="32" x2="54" y2="31"/>
      <line x1="26" y1="32" x2="28" y2="52"/>
      <line x1="54" y1="31" x2="52" y2="51"/>
      <line x1="28" y1="52" x2="52" y2="51"/>
    </g>
    <circle cx="40" cy="18" r="3.2" fill="#C4784A"/>
    <circle cx="40" cy="18" r="5.5" fill="#D4A574" opacity="0.22"/>
    <circle cx="26" cy="32" r="2.1" fill="#1B2A4A"/>
    <circle cx="54" cy="31" r="2.1" fill="#1B2A4A"/>
    <circle cx="28" cy="52" r="2.2" fill="#D4A574"/>
    <circle cx="52" cy="51" r="2.1" fill="#D4A574"/>
    <!-- Orbit node -->
    <circle cx="70" cy="28" r="1.6" fill="#C4784A"/>
  </g>
  <text x="100" y="48" fill="#1B2A4A" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600" letter-spacing="-0.02em">Lyra Group</text>
  <text x="100" y="70" fill="#6B6560" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="0.08em">PRECISION RECOVERY. PURPOSEFUL RESULTS.</text>
</svg>
